<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookworm</title>
    <link rel="icon" href="./assets/favicon.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/authenticate.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Yusei+Magic&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Bookworm</h1>
        <nav>
          <a href="index.html">Home</a>
          <a id="linkToAuth" href="authenticate.html">Login</a>
          <a id="linkToRegister" href="register.html">Register</a>
        </nav>
      </header>
      <main>
        <form id="authForm">
          <fieldset>
            <legend id="authLegend">Authenticate</legend>
            <p id="AuthResponse" class="auth-response"></p>
            <div
              id="authInputFieldsContainer"
              class="auth-input-field-container"
            ></div>
            <input
              id="authSubmitButton"
              type="submit"
              value="submit"
              class="auth-submit-button btn btn-info btn-shadow"
            />
          </fieldset>
        </form>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/global.js"></script>
    <script src="js/authenticate.js"></script>
  </body>
</html>
